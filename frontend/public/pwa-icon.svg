<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ea580c" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#qbGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Inner Vibrant App Icon Surface -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#qbGrad)" filter="url(#shadow)" />
  <rect x="40" y="40" width="432" height="216" rx="96" fill="url(#glowGrad)" />

  <!-- Shopping Bag / POS Register Icon Outline -->
  <g transform="translate(116, 100)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag Handle -->
    <path d="M 80 120 A 60 60 0 0 1 200 120" stroke-width="24" />
    <!-- Bag Body -->
    <rect x="20" y="100" width="240" height="210" rx="36" fill="#ffffff" fill-opacity="0.15" stroke-width="26" />
    <!-- Central Lightning Flash (Quick POS) -->
    <path d="M 148 135 L 105 210 L 140 210 L 122 280 L 180 195 L 145 195 Z" fill="#ffffff" stroke="none" />
  </g>

  <!-- QuickBizs Brand Monogram -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">QUICKBIZS</text>
</svg>
