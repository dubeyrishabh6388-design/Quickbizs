<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuickBizs" />
    <meta name="application-name" content="QuickBizs" />
    <meta name="description" content="QuickBizs - Smart Retail Billing, POS, Inventory & Khata Management Operating System" />
    <title>QuickBizs - Business Operating System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:0;padding:24px;box-sizing:border-box;">
        <div style="position:relative;margin-bottom:24px;">
          <div style="position:absolute;inset:-12px;background:radial-gradient(circle,rgba(249,115,22,0.35) 0%,rgba(99,102,241,0.2) 70%,transparent 100%);filter:blur(24px);border-radius:24px;"></div>
          <div style="position:relative;width:88px;height:88px;border-radius:22px;background:#ffffff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 25px 30px -5px rgba(0,0,0,0.6);">
            <img src="/pwa-icon.svg" alt="QuickBizs" style="width:100%;height:100%;object-fit:cover;border-radius:20px;" />
          </div>
        </div>
        <div style="font-size:28px;font-weight:900;letter-spacing:-0.03em;margin-bottom:6px;display:flex;align-items:center;gap:2px;">
          <span>Quick</span><span style="color:#f97316;">Bizs</span>
        </div>
        <div style="font-size:12px;color:#64748b;font-weight:600;letter-spacing:0.02em;margin-bottom:28px;">
          Smart Retail POS &amp; Business Operating System
        </div>
        <div style="width:180px;height:4px;background:#e2e8f0;border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:60%;height:100%;background:linear-gradient(90deg,#f97316,#fbbf24,#6366f1);border-radius:999px;animation:qbPulse 1.2s ease-in-out infinite alternate;"></div>
        </div>
        <style>
          @keyframes qbPulse {
            0% { transform: translateX(-40%); }
            100% { transform: translateX(110%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent("pwa-prompt-available"));
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js").then(function(reg) {
            console.log("[PWA] ServiceWorker registered with scope:", reg.scope);
          }).catch(function(err) {
            console.warn("[PWA] ServiceWorker registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
